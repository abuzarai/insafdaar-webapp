x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:15-alpine
    container_name: insafdaar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-insafdaar_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-insafdaar_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    logging: *default-logging

  backend:
    build:
      context: ./backend
    container_name: insafdaar-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: ${PORT:-5000}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-insafdaar_db}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      ADMIN_EMAIL: ${ADMIN_EMAIL}

      # Google Calendar (used by utils/googleCalendar.js meet-link creation)
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ${GOOGLE_SERVICE_ACCOUNT_EMAIL}
      GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY}
      GOOGLE_IMPERSONATE_USER_EMAIL: ${GOOGLE_IMPERSONATE_USER_EMAIL}
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-primary}

      # Voice Intake Agent
      VOICE_WEBHOOK_SECRET: ${VOICE_WEBHOOK_SECRET}

      # Legal RAG Proxy
      LEGAL_RAG_API_URL: ${LEGAL_RAG_API_URL}
      LEGAL_RAG_TIMEOUT_MS: ${LEGAL_RAG_TIMEOUT_MS:-45000}
      LEGAL_ASSISTANT_GUEST_PROMPT_LIMIT: ${LEGAL_ASSISTANT_GUEST_PROMPT_LIMIT:-3}
      DRAFTING_ASSISTANT_URL: ${DRAFTING_ASSISTANT_URL}
      DRAFTING_ASSISTANT_TIMEOUT_MS: ${DRAFTING_ASSISTANT_TIMEOUT_MS:-45000}
      DRAFTING_ASSISTANT_GENERATE_TIMEOUT_MS: ${DRAFTING_ASSISTANT_GENERATE_TIMEOUT_MS:-90000}

    ports:
      - "5000:5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/webhooks/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 512m
    logging: *default-logging

    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        # API must be reachable from the user’s browser; use host-mapped ports.
        REACT_APP_API_BASE_URL: ${REACT_APP_API_BASE_URL:-http://localhost:5000}
        REACT_APP_VOICE_SERVICE_URL: ${REACT_APP_VOICE_SERVICE_URL}
    container_name: insafdaar-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 128m
    logging: *default-logging

  # ─────────────────────────────────────────────────────────────
  # AI microservices
  # Build contexts expect the sibling repos cloned next to webapp:
  #   ../legal-rag-assistant  ../drafting-assistant  ../voice_intake_agent
  # ─────────────────────────────────────────────────────────────
  weaviate:
    image: semitechnologies/weaviate:1.28.4
    container_name: insafdaar-weaviate
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --header='Authorization: Bearer ${WEAVIATE_API_KEY}' http://localhost:8080/v1/meta || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    mem_limit: 1500m
    logging: *default-logging
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "false"
      AUTHENTICATION_APIKEY_ENABLED: "true"
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: ${WEAVIATE_API_KEY}
      AUTHENTICATION_APIKEY_USERS: admin
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      CLUSTER_HOSTNAME: ${CLUSTER_HOSTNAME}
      QUERY_DEFAULTS_LIMIT: 25
      DEFAULT_VECTORIZER_MODULE: none
      ENABLE_MODULES: ""
      # raft join can exceed the default timeout on the 1GB micro under
      # swap pressure (crash-restart cycle during deploys); vendor-recommended
      RAFT_BOOTSTRAP_TIMEOUT: 60
    volumes:
      - weaviate_data:/var/lib/weaviate

  legal-rag:
    build:
      context: ../legal-rag-assistant
    container_name: insafdaar-legal-rag
    depends_on:
      weaviate:
        condition: service_healthy
    restart: unless-stopped
    environment:
      ENV: prod
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      GEMINI_API_KEY: ${RAG_GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      EMBEDDING_MODEL: gemini-embedding-001
      EMBEDDING_OUTPUT_DIMS: "768"
      WEAVIATE_URL: http://weaviate:8080
      WEAVIATE_API_KEY: ${WEAVIATE_API_KEY}
      WEAVIATE_COLLECTION: LegalChunk
      WEAVIATE_GRPC_PORT: "50051"
      DRIVE_ROOT_FOLDER_ID: ${DRIVE_ROOT_FOLDER_ID}
      DRIVE_ALLOWED_EXTS: ${DRIVE_ALLOWED_EXTS:-pdf}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/drive-sa.json
      INGESTION_STATE_BACKEND: file
    volumes:
      - ../legal-rag-assistant/service_account.json:/run/secrets/drive-sa.json:ro
      - rag_artifacts:/app/artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health', timeout=3).status==200 else 1)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 1200m
    logging: *default-logging

  drafting:
    build:
      context: ../drafting-assistant
    container_name: insafdaar-drafting
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    environment:
      ENV: production
      GEMINI_API_KEY: ${DRAFTING_GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      EXPRESS_INTERNAL_URL: http://backend:5000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      CORS_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health', timeout=3).status==200 else 1)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 512m
    logging: *default-logging

  voice:
    build:
      context: ../voice_intake_agent
    container_name: insafdaar-voice
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      GEMINI_API_KEY: ${VOICE_GEMINI_API_KEY}
      GEMINI_MODEL: ${VOICE_GEMINI_MODEL:-gemini-2.5-flash}
      AUDIO_DIR: /data/audio
      EXPRESS_WEBHOOK_URL: http://backend:5000/api/webhooks/interview-complete
      EXPRESS_WEBHOOK_SECRET: ${VOICE_WEBHOOK_SECRET}
      CORS_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    ports:
      - "127.0.0.1:8002:8000"   # browser-facing (localhost = secure ctx for mic)
    volumes:
      - ./ai-data/voice-audio:/data/audio
    mem_limit: 256m
    logging: *default-logging
    # Override Dockerfile HEALTHCHECK: python cold-start on the 1GB micro
    # can exceed the image's 3s timeout under swap pressure.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  postgres_data:
  weaviate_data:
  rag_artifacts:
