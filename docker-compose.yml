services:
  db:
    image: postgres:15-alpine
    container_name: insafdaar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-insafdaar_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
    container_name: insafdaar-backend
    depends_on:
      - db
    environment:
      PORT: ${PORT:-5000}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-insafdaar_db}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      ADMIN_EMAIL: ${ADMIN_EMAIL}

      # Voice Intake Agent
      VOICE_SERVICE_URL: ${VOICE_SERVICE_URL}
      VOICE_WEBHOOK_SECRET: ${VOICE_WEBHOOK_SECRET}

      # Legal RAG Proxy
      LEGAL_RAG_API_URL: ${LEGAL_RAG_API_URL}
      LEGAL_RAG_REQUIRE_AUTH: ${LEGAL_RAG_REQUIRE_AUTH:-false}
      LEGAL_RAG_AUDIENCE: ${LEGAL_RAG_AUDIENCE}
      LEGAL_RAG_TIMEOUT_MS: ${LEGAL_RAG_TIMEOUT_MS:-45000}
      LEGAL_ASSISTANT_GUEST_PROMPT_LIMIT: ${LEGAL_ASSISTANT_GUEST_PROMPT_LIMIT:-3}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-/run/secrets/gcp-rag-invoker.json}
      DRAFTING_ASSISTANT_URL: ${DRAFTING_ASSISTANT_URL}
      DRAFTING_ASSISTANT_TIMEOUT_MS: ${DRAFTING_ASSISTANT_TIMEOUT_MS:-45000}
      DRAFTING_ASSISTANT_GENERATE_TIMEOUT_MS: ${DRAFTING_ASSISTANT_GENERATE_TIMEOUT_MS:-90000}

    ports:
      - "5000:5000"
    restart: unless-stopped

    volumes:
      - ./backend/uploads:/app/uploads
      - ${GCP_RAG_KEY_PATH:-./secrets/gcp-rag-invoker.json}:/run/secrets/gcp-rag-invoker.json:ro

  frontend:
    build:
      context: ./frontend
      args:
        # API must be reachable from the user’s browser; use host-mapped ports.
        REACT_APP_API_BASE_URL: ${REACT_APP_API_BASE_URL:-http://localhost:5000}
        REACT_APP_LEGAL_RAG_API: ${REACT_APP_LEGAL_RAG_API}
        REACT_APP_CHAT_HISTORY_API: ${REACT_APP_CHAT_HISTORY_API:-http://localhost:5000}
        REACT_APP_VOICE_SERVICE_URL: ${REACT_APP_VOICE_SERVICE_URL}
    container_name: insafdaar-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────
  # AI microservices (local stack — replaces Cloud Run)
  # Build contexts expect sibling clones:
  #   Projects/webapp  Projects/legal-rag-assistant
  #   Projects/drafting-assistant  Projects/voice_intake_agent
  # ─────────────────────────────────────────────────────────────
  weaviate:
    image: semitechnologies/weaviate:1.28.4
    container_name: insafdaar-weaviate
    restart: unless-stopped
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "false"
      AUTHENTICATION_APIKEY_ENABLED: "true"
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: ${WEAVIATE_API_KEY}
      AUTHENTICATION_APIKEY_USERS: admin
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      QUERY_DEFAULTS_LIMIT: 25
      DEFAULT_VECTORIZER_MODULE: none
      ENABLE_MODULES: ""
    volumes:
      - weaviate_data:/var/lib/weaviate
    mem_limit: 1500m

  legal-rag:
    build:
      context: ../legal-rag-assistant
    container_name: insafdaar-legal-rag
    depends_on:
      - weaviate
    restart: unless-stopped
    environment:
      ENV: prod
      GEMINI_API_KEY: ${RAG_GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      EMBEDDING_MODEL: gemini-embedding-001
      EMBEDDING_OUTPUT_DIMS: "768"
      WEAVIATE_URL: http://weaviate:8080
      WEAVIATE_API_KEY: ${WEAVIATE_API_KEY}
      WEAVIATE_COLLECTION: LegalChunk
      WEAVIATE_GRPC_PORT: "50051"
      DRIVE_ROOT_FOLDER_ID: ${DRIVE_ROOT_FOLDER_ID}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/drive-sa.json
      INGESTION_STATE_BACKEND: file
    volumes:
      - ../legal-rag-assistant/service_account.json:/run/secrets/drive-sa.json:ro
      - rag_artifacts:/app/artifacts
    mem_limit: 1200m

  drafting:
    build:
      context: ../drafting-assistant
    container_name: insafdaar-drafting
    depends_on:
      - backend
    restart: unless-stopped
    environment:
      ENV: production
      GEMINI_API_KEY: ${DRAFTING_GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      EXPRESS_INTERNAL_URL: http://backend:5000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      CORS_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    mem_limit: 512m

  voice:
    build:
      context: ../voice_intake_agent
    container_name: insafdaar-voice
    restart: unless-stopped
    # Run as root so host bind mounts stay writable without choreography.
    # (Image default is appuser; revisit ownership before exposing publicly.)
    user: "0:0"
    environment:
      ENVIRONMENT: production
      GEMINI_API_KEY: ${VOICE_GEMINI_API_KEY}
      GEMINI_MODEL: ${VOICE_GEMINI_MODEL:-gemini-2.5-flash}
      AUDIO_DIR: /data/audio
      EXPRESS_WEBHOOK_URL: http://backend:5000/api/webhooks/interview-complete
      EXPRESS_WEBHOOK_SECRET: ${VOICE_WEBHOOK_SECRET}
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "127.0.0.1:8002:8000"   # browser-facing (localhost = secure ctx for mic)
    volumes:
      - ./ai-data/voice-audio:/data/audio
    mem_limit: 256m

volumes:
  postgres_data:
  weaviate_data:
  rag_artifacts:
