name: Install owner-approved release

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Pre-staged release directory name
        required: true
        type: string
      manifest_sha256:
        description: SHA256 of the reviewed manifest.json
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-vm
  cancel-in-progress: false

jobs:
  approval-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Require manual owner approval on main
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_ACTOR" = "$GITHUB_REPOSITORY_OWNER"
          test "$GITHUB_TRIGGERING_ACTOR" = "$GITHUB_REPOSITORY_OWNER"
          [[ "$RELEASE_ID" =~ ^[a-z0-9][a-z0-9-]{0,63}$ ]]
          [[ "$MANIFEST_SHA256" =~ ^[a-f0-9]{64}$ ]]
        shell: bash

  install-paused:
    if: github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    needs: approval-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the deployment controls used by this workflow
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify and install the staged release
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$RELEASE_ID" =~ ^[a-z0-9][a-z0-9-]{0,63}$ ]]
          [[ "$MANIFEST_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          test -n "$DEPLOY_KEY" && test -n "$DEPLOY_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/deploy_key' EXIT
          runner_sha=$(sha256sum scripts/apply-migrations.sh | cut -d ' ' -f 1)
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=30 -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
            "ubuntu@$DEPLOY_HOST" \
            "bash -s -- '$RELEASE_ID' '$MANIFEST_SHA256' '$runner_sha'" < scripts/deploy.sh
        shell: bash
