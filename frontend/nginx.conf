server {
    listen 80;
    server_name _;

    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers (inherited by locations without their own add_header).
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' blob: data:; connect-src 'self' http://localhost:* ws://localhost:* https: wss:; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

    # Never cache the entry document — it references hashed assets.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' blob: data:; connect-src 'self' http://localhost:* ws://localhost:* https: wss:; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    }

    # Hashed static assets are immutable — cache aggressively.
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Service worker must always revalidate.
    location = /service-worker.js {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri /index.html;
    }

    # Proxy API routes to backend. Internal-only routes are NOT exposed here;
    # microservices reach the backend directly over the compose network.
    # Resolver + variable: re-resolve `backend` so recreates (new container
    # IP) don't leave this proxy pointing at a dead address.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:5000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Drafting calls can run 90-180s; backend aborts via its own timeout.
        proxy_read_timeout 200s;
        proxy_send_timeout 200s;
    }

    # Internal-only routes are explicitly closed on the public listener.
    location /internal/ {
        return 404;
    }

    # Optional: gzip static assets
    gzip on;
    gzip_types text/plain application/xml text/css application/javascript application/json image/svg+xml;
    gzip_min_length 10240;
}