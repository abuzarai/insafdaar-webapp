server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Never cache the entry document — it references hashed assets.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Hashed static assets are immutable — cache aggressively.
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Service worker must always revalidate.
    location = /service-worker.js {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
    }

    # Proxy API and internal service routes to backend.
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /internal/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Optional: gzip static assets
    gzip on;
    gzip_types text/plain application/xml text/css application/javascript application/json image/svg+xml;
    gzip_min_length 10240;
}
