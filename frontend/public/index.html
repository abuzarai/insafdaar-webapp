<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- ✅ Favicon and App Icons -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/icons/icon-192.png" />

    <!-- ✅ Viewport and Theming -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#004aad" />

    <meta property="og:title" content="Insafdaar — AI Legal Platform" />

      property="og:description"
      content="Revolutionizing legal practice with AI — secure, efficient, and client-focused justice system."
    />
    <meta property="og:image" content="%PUBLIC_URL%/icons/icon-512.png" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://insafdaar.ai" />

    <!-- ✅ Title -->
    <title>Insafdaar — AI Legal Platform</title>

      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
